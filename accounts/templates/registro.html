{% extends 'base.html' %}

{% block content %}
    <form method="post">
        {% csrf_token %}
        <style> 
            table tr th, table tr td:first-child {
                text-align: left;
                padding-right: 10px;
            }
        </style>

        <table>           
            <div class="form-group">
                {{ user_form.username.errors }}
                <label> Usuário: </label>
                 {{ user_form.username }}
            </div>

            <div class="form-group">
                {{ user_form.password1.errors }}
                <label> Senha: </label>
                 {{ user_form.password1 }}
            </div>

            <div class="form-group">
                {{ user_form.password2.errors }}
                <label> Confirmação da Senha: </label>
                 {{ user_form.password2 }}
            </div>            

            <div class="form-group">
                <input type="submit", value="Cadastrar" class="btn btn-primary">
            </div>
        </table>        
    </form>
{% endblock %}
