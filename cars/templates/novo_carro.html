{% extends 'base.html' %}

{% block content %}
    <form method="post", enctype="multipart/form-data">
        {% csrf_token %}
        <style> 
            table tr th, table tr td:first-child {
                text-align: left;
                padding-right: 10px;
            }
        </style>

        <table>
            {{ new_car_form.as_table }}
        </table>
        <input type="submit", value="Cadastrar" class="btn btn-primary">
    </form>
{% endblock %}
